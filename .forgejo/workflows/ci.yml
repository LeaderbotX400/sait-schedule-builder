name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Package extension
        run: |
          cd dist
          zip -r ../sait-schedule-builder-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip .

      - name: Create Forgejo release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: https://code.forgejo.org/actions/forgejo-release@v2.12.1
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          title: ${{ github.ref_name }}
          release-dir: .
          token: ${{ secrets.GITHUB_TOKEN }}
